name: Build Keljoy Phone OS EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow psutil requests pyinstaller

    - name: Build with PyInstaller
      shell: powershell
      run: |
        $add_data = '--add-data "i (2).png;."'
        
        Get-ChildItem -Filter "video_file_kel*.mp4" | ForEach-Object {
            $add_data += " --add-data `"$($_.Name);.`""
        }
        
        Invoke-Expression "pyinstaller --noconfirm --onefile --windowed $add_data main.py"

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Keljoy-Phone-OS
        path: dist/main.exe
